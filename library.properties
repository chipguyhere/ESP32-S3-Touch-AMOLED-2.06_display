sentence=CO5300 AMOLED display + FT3168 touch driver for the Waveshare ESP32-S3-Touch-AMOLED-2.06 (2.06" 410x502 QSPI AMOLED watch board).
paragraph=Drives the 410x502 CO5300 AMOLED over QSPI through the ESP-IDF esp_lcd panel IO with asynchronous DMA flushes, software rotation in all four orientations, and the even-alignment rounder the controller requires, and reads the FT3168 capacitive touch controller. Ships LVGL 9.3 examples (a hand-written Claude Code stub, resolution-independent demos, and a SquareLine Studio launcher) with display, touch, and LVGL plumbing already wired up. Requires chipguy_ESP32-S3-Touch-AMOLED-2.06_board for the shared I2C bus and the panel's power rail.
